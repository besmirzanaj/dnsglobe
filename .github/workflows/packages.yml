# Builds .deb and .rpm packages for dnsglobe after a release and pushes
# them to the Gemfury repo at https://repo.cloudalbania.com/.
#
# Expects this GitHub secret:
#   GEMFURY_PUSH_URL  — e.g. https://<token>@push.fury.io/<account>/
name: Linux packages

on:
  workflow_run:
    workflows: [Release]
    types:
      - completed
  workflow_dispatch:

jobs:
  build:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build .deb
        run: cargo deb
        env:
          CARGO_PROFILE_RELEASE_LTO: thin

      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked

      - name: Build .rpm
        run: cargo generate-rpm

      - name: Push to Gemfury
        env:
          PUSH_URL: ${{ secrets.GEMFURY_PUSH_URL }}
        run: |
          if [ -z "$PUSH_URL" ]; then
            echo "GEMFURY_PUSH_URL not set — skipping push"
            exit 0
          fi
          for pkg in target/debian/*.deb target/generate-rpm/*.rpm; do
            [ -f "$pkg" ] || continue
            echo "Uploading $pkg …"
            curl -sSf -F "package=@$pkg" "$PUSH_URL" || echo "gemfury push failed for $pkg"
          done