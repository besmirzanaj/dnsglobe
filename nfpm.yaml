name: dnsglobe
version: "${NFPMS_VERSION}"
release: 1
arch: amd64
license: MIT
vendor: "Besmir Zanaj"
homepage: "https://github.com/besmirzanaj/dnsglobe"
maintainer: "Besmir Zanaj <besmirzanaj@gmail.com>"
